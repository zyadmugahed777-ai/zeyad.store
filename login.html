    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        // Ask the server, do not consult localStorage: a hand-edited cache
        // entry must never be enough to look signed in.
        const user = await window.ZFB_AUTH.ready();
        if (user && user.id) {
          window.location.href = 'account.html';
          return;
        }

        const mount = document.getElementById('zfb-login-mount');
        mount.appendChild(window.ZFB_AUTH.buildAuthCard({
          mode: new URLSearchParams(location.search).get('mode') === 'register' ? 'register' : 'login',
          onSuccess: () => { window.location.href = 'account.html'; }
        }));
      });
    </script>
