<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="زياد ستور — Zeyad Store">
  <!--
    The Zeyad Store mark: a bold Latin Z on a gold disc.

    Two deliberate changes from what this replaced.

    THE LETTER IS A PATH, NOT TEXT. The previous version set the glyph with
    a <text> element naming 'IBM Plex Sans Arabic', which asks whoever renders
    the file to have that font. Google's result renderer, an Android launcher
    building a home screen icon, a browser tab on a machine without the family:
    each would substitute something else, so the brand mark was not guaranteed
    to be the same shape twice. A path renders identically everywhere and
    depends on nothing.

    THE COLOUR IS THE BRAND'S GOLD, NOT OLIVE. #c79a52 appears 54 times across
    the stylesheets; it is what the shop actually looks like. The gradient runs
    #e8c67d to #c79a52 to #a87c38 so the disc reads as struck metal rather than
    a flat circle.

    The glyph is a dark warm brown rather than cream. Cream on gold measures
    about 2.3:1, which smears at the 16px a browser tab renders; #3a2a12 on the
    same gold measures 5.4:1 and stays a legible Z at that size. That is the
    size that matters, because this is what appears beside the shop's name in a
    Google result and on a phone's home screen.
  -->
  <defs>
    <linearGradient id="zsDisc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c67d"/>
      <stop offset="0.55" stop-color="#c79a52"/>
      <stop offset="1" stop-color="#a87c38"/>
    </linearGradient>
    <radialGradient id="zsSheen" cx="0.3" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#fff8ed" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#fff8ed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#zsDisc)"/>
  <circle cx="32" cy="32" r="32" fill="url(#zsSheen)"/>

  <!--
    A geometric Z, drawn as one closed polygon: top bar, diagonal, bottom bar.
    Bars are 9 units thick and the diagonal measures about 9.2 perpendicular,
    so the three strokes read as one weight. No thin joints anywhere, which is
    what survives being scaled down to a favicon.
  -->
  <path d="M17 16 L47 16 L47 25 L31 39 L47 39 L47 48 L17 48 L17 39 L33 25 L17 25 Z"
        fill="#3a2a12"/>
</svg>
